
name: Atualizar dados de futebol

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar jogos reais
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ["FOOTBALL_DATA_API_KEY"]
          url = "https://api.football-data.org/v4/competitions/BSA/matches"

          request = urllib.request.Request(
              url,
              headers={"X-Auth-Token": token}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "competition": "Brasileirao Serie A",
              "matches": data.get("matches", [])
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/matches.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Partidas recebidas:", len(output["matches"]))
          PY

      - name: Salvar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar partidas do Brasileirao"
            git push
          fi
